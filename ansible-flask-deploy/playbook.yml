---
- name: Deploy Flask app with Docker
  hosts: servers
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create project directory
      ansible.builtin.file:
        path: /opt/flask-app
        state: directory
        mode: "0755"

    - name: Create Flask application
      ansible.builtin.copy:
        dest: /opt/flask-app/app.py
        mode: "0644"
        content: |
          from flask import Flask

          app = Flask(__name__)


          @app.route("/")
          def hello():
              return "Hello from Ansible + Docker!"


          @app.route("/health")
          def health():
              return {"status": "ok"}


          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)

    - name: Create requirements.txt
      ansible.builtin.copy:
        dest: /opt/flask-app/requirements.txt
        mode: "0644"
        content: |
          Flask==3.1.3

    - name: Create Dockerfile
      ansible.builtin.copy:
        dest: /opt/flask-app/Dockerfile
        mode: "0644"
        content: |
          FROM python:3.12-slim

          WORKDIR /app

          COPY requirements.txt .

          RUN pip install --no-cache-dir -r requirements.txt

          COPY app.py .

          CMD ["python", "app.py"]

    - name: Create docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/flask-app/docker-compose.yml
        mode: "0644"
        content: |
          services:
            web:
              build: .
              ports:
                - "5001:5000"

    - name: Start Flask application
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/flask-app
