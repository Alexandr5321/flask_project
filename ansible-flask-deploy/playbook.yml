---
- name: Deploy Flask application
  hosts: servers
  become: true

  vars:
    app_dir: /opt/flask-app
    repository: "https://github.com/Alexandr5321/flask_project.git"
    branch: develop

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Checkout application repository
      ansible.builtin.git:
        repo: "{{ repository }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: true

    - name: Start Flask application
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
